name: Build and deploy to ECS

on:
  push:
    branches:
      - main
    paths-ignore:
      - deploy.auto.tfvars

permissions:
  contents: write
  id-token: write

concurrency:
  group: ecs-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ecs-demo

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build --tag "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" ./app
          docker push "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Trigger Terraform Cloud VCS run
        run: |
          git fetch origin main
          git checkout -B main origin/main
          printf 'aws_region = "%s"\nimage_tag = "%s"\ndesired_count = 1\n' "$AWS_REGION" "$GITHUB_SHA" > deploy.auto.tfvars
          git add deploy.auto.tfvars
          if git diff --cached --quiet; then
            echo "Terraform deployment variables are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy image ${GITHUB_SHA}"
          git push origin main